name: Fast CI/CD Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ⚡ Fast Build (GitHub 16GB Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image tag
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${OWNER_LOWER}/student-portal:latest" >> $GITHUB_ENV

      - name: Build and push Docker image with GitHub cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: 🚀 Instant EC2 Deploy (~15s)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_stop: true
          script: |
            cd /var/www/student-portal
            echo "=== 1. Syncing config ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Authenticating with GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== 3. Pulling pre-built Docker image ==="
            sudo docker compose pull

            echo "=== 4. Starting new container instantly ==="
            sudo docker compose up -d

            echo "=== 5. Cleaning old dangling images ==="
            sudo docker image prune -f

            echo "=== 6. Live Status ==="
            sudo docker ps --filter "name=srmap-student-portal" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "✅ Fast Deploy Complete in seconds!"
