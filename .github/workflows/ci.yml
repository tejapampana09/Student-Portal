name: CI & Enterprise Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Deterministic Dependency Installation
        run: npm ci --legacy-peer-deps

      - name: Code Linting & Core Web Vitals
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Security Vulnerability Gate
        run: npm audit --audit-level=high

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          ACCESS_SECRET: "ci_build_dummy_access_secret_32_chars_long_key"
          DB_ENCRYPTION_KEY: "ci_build_dummy_encryption_key_32_chars_long"
          JWT_SECRET: "ci_build_dummy_jwt_secret_32_chars_long_key"
