name: Prepare security dependency lockfile
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/security-lockfile.yml]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve compatible security updates
        run: |
          npm pkg set overrides.zod=4.6.6
          npm audit fix --package-lock-only --legacy-peer-deps --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-lockfile
          path: |
            package.json
            package-lock.json
          retention-days: 1
