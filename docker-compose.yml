version: '3.8'

services:
  student-portal:
    image: ghcr.io/tejapampana09/student-portal:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srmap-student-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=${MONGO_URI}
      - FORUMS_MONGO_URI=${FORUMS_MONGO_URI}
      - ACCESS_SECRET=${ACCESS_SECRET}
      - ACCESS_EXPIRE=${ACCESS_EXPIRE:-30d}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-${ACCESS_SECRET}}
      - CRON_SECRET=${CRON_SECRET:-${ACCESS_SECRET}}
    env_file:
      - .env
