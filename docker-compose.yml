services:
  student-portal:
    image: ghcr.io/tejapampana09/student-portal:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srmap-student-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=${MONGO_URI}
      - FORUMS_MONGO_URI=${FORUMS_MONGO_URI}
      - ACCESS_SECRET=${ACCESS_SECRET}
      - ACCESS_EXPIRE=${ACCESS_EXPIRE:-30d}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      - CRON_SECRET=${CRON_SECRET}
    env_file:
      - .env
